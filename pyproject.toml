[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aesim"
version = "0.1.0"
description = "UK A&E department discrete-event simulator: Type 1 ED + co-located UTC, SDEC and inpatient bed exit-block"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ferhat Culfaz" }]
dependencies = [
    "simpy>=4.1,<5",
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "sim-tools==1.3.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.49",
    "plotly>=5.20",
    "vidigi==1.3.1",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.4",
    "scipy>=1.11",
    "joblib>=1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aesim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "calibration: slow calibration/validation runs against NHS actual bands (deselect with '-m \"not calibration\"')",
]
addopts = "-m 'not calibration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
